# 涉密项均从环境变量读取；本地与服务器统一使用项目根目录 .env（见 .env.example）
spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: zdmj

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${APP_REMOTE_HOST:localhost}:5432/${PG_DB:zdmj}?currentSchema=public&stringtype=unspecified&TimeZone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:${PG_USER:zdmj}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PG_PASSWORD:}}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:${APP_REMOTE_HOST:localhost}}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
        shutdown-timeout: 200ms

  mail:
    host: ${SPRING_MAIL_HOST:smtp.163.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: false
            required: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${SPRING_AI_OPENAI_API_KEY:${DASHSCOPE_API_KEY:}}
      chat:
        options:
          model: ${AL_MODEL:qwen3.7-max}
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.zdmj
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

api:
  prefix: /api/zdmj

springdoc:
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.zdmj: DEBUG

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:}
  bucket-name: ${COS_BUCKET_NAME:${COS_BUCKET:}}
  presigned-url-expiration: 3600

app:
  remote:
    host: ${APP_REMOTE_HOST:localhost}
  jwt:
    secret: ${JWT_SECRET:}
  ai:
    user-llm:
      require-user-config: false
      platform-fallback-enabled: true
      require-encryption-key: false
      encryption-key: ${APP_AI_USER_KEY_ENCRYPTION_KEY:}
      advisors:
        enabled: false
        tool-call-enabled: false
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}