x-app-service: &app-service
  restart: always
  networks:
    - backend

x-app-depends: &app-depends
  depends_on:
    - postgres
    - redis

x-redis-conn-env: &redis-conn-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: 0

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: pgsql
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      # 设置PostgreSQL时区为Asia/Shanghai（UTC+8）
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ../../data/pgsql:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
    networks:
      - backend

  backend:
    <<: [*app-service, *app-depends]
    build:
      context: ../backend/zdmj
      dockerfile: Dockerfile
    image: zdmj-backend:latest
    container_name: zdmj-backend
    ports:
      - "8080:8080"
    # 与 compose 文件同目录的 .env 显式注入，避免工作目录不对时变量未加载
    env_file:
      - .env
    environment:
      <<: *redis-conn-env
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_OPENAI_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode
      AL_MODEL: ${AL_MODEL:-qwen-plus}
      DATASOURCE_URL: ${DATASOURCE_URL}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET: ${COS_BUCKET}

networks:
  backend:
    driver: bridge
