# 涉密配置统一放在项目根目录 .env（见 /.env.example），勿写入 compose 明文
x-app-service: &app-service
  restart: always
  networks:
    - backend

x-app-depends: &app-depends
  depends_on:
    - postgres
    - redis

x-redis-conn-env: &redis-conn-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: 0

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: pgsql
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ../../data/pgsql:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    restart: always
    env_file:
      - ../.env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
    networks:
      - backend

  backend:
    <<: [*app-service, *app-depends]
    build:
      context: ../backend/zdmj
      dockerfile: Dockerfile
    image: zdmj-backend:latest
    container_name: zdmj-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      <<: *redis-conn-env
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge
    volumes:
      - type: bind
        source: ${KNOWLEDGE_STORAGE_ROOT}
        target: /app/data/knowledge
        bind:
          create_host_path: false

  knowledge-import:
    image: ${JAVAGUIDE_IMPORT_IMAGE:-zdmj-backend:latest}
    profiles: [knowledge-import]
    restart: "no"
    networks: [backend]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      KNOWLEDGE_SYSTEM_IMPORT_ROOT: /app/data/knowledge-sync/javaguide
    entrypoint:
      - java
      - -Duser.timezone=Asia/Shanghai
      - -Dloader.main=com.zdmj.knowledgeService.config.SystemKnowledgeImportApplication
      - -cp
      - app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    volumes:
      - type: bind
        source: ${JAVAGUIDE_DATA_ROOT:-/opt/zdmj/data/knowledge-sync/javaguide}
        target: /app/data/knowledge-sync/javaguide
        read_only: true
        bind:
          create_host_path: false

  frontend-main:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        NGINX_CONF: deploy/nginx.conf
    image: zdmj-frontend-main:latest
    container_name: zdmj-frontend-main
    restart: always
    ports:
      - "80:80"
    networks:
      - backend

networks:
  backend:
    driver: bridge
