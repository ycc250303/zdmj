# 涉密配置统一放在项目根目录 .env（见 /.env.example），勿写入 compose 明文
x-app-service: &app-service
  restart: always
  networks:
    - backend

x-app-depends: &app-depends
  depends_on:
    - postgres
    - redis

x-redis-conn-env: &redis-conn-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: 0

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: pgsql
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ../../data/pgsql:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    restart: always
    env_file:
      - ../.env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
    networks:
      - backend

  backend:
    <<: [*app-service, *app-depends]
    build:
      context: ../backend/zdmj
      dockerfile: Dockerfile
    image: zdmj-backend:latest
    container_name: zdmj-backend
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      <<: *redis-conn-env
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_AI_OPENAI_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode
      AL_MODEL: ${AL_MODEL:-qwen3.6-plus}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET: ${COS_BUCKET}
      COS_BUCKET_NAME: ${COS_BUCKET}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  frontend-main:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        NGINX_CONF: deploy/nginx.conf
    image: zdmj-frontend-main:latest
    container_name: zdmj-frontend-main
    restart: always
    ports:
      - "80:80"
    networks:
      - backend

  frontend-new-f:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        NGINX_CONF: deploy/nginx-new-f.conf
    image: zdmj-frontend-new-f:latest
    container_name: zdmj-frontend-new-f
    restart: always
    ports:
      - "1234:1234"
    networks:
      - backend

  frontend-xhr:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        NGINX_CONF: deploy/nginx-frontend-xhr.conf
    image: zdmj-frontend-xhr:latest
    container_name: zdmj-frontend-xhr
    restart: always
    ports:
      - "5678:5678"
    networks:
      - backend

networks:
  backend:
    driver: bridge
