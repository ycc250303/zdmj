services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: pgsql
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      # 设置PostgreSQL时区为Asia/Shanghai（UTC+8）
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ../../data/pgsql:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
    networks:
      - backend

  backend:
    build:
      context: ../backend/zdmj
      dockerfile: Dockerfile
    image: zdmj-backend:latest
    container_name: zdmj-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 计划废弃 Python 服务：暂时不注入 PYTHON_SERVICE_URL
      # PYTHON_SERVICE_URL: http://python:8000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_AI_DASHSCOPE_CHAT_API_KEY: ${DASHSCOPE_API_KEY}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET_NAME: ${COS_BUCKET_NAME}
    depends_on:
      - postgres
      - redis
      # 计划废弃 Python 服务
      # - python
    networks:
      - backend

  python:
    build:
      context: ../backend/zdmj-python
      dockerfile: Dockerfile
    image: zdmj-python:latest
    container_name: zdmj-python
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_NAME: zdmj-python
      APP_VERSION: 1.0.0
      DEBUG: false
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      API_PREFIX: /api
    volumes:
      - ../../data/python/logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 8000)); s.close()\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend:
    driver: bridge
