# CD：一次发布同步已通过 CI 的固定提交，再构建被改动的后端和前端。
# 目标判断见 .github/scripts/deploy_targets.sh，远端执行见 deploy/release.sh。

name: CD - Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/zdmj/**'
      - 'sql/**'
      - 'deploy/deploy_backend.sh'
      - 'deploy/sync_server_code.sh'
      - 'deploy/release.sh'
      - 'deploy/runtime.sh'
      - 'deploy/health.sh'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/ci_java.yml'
      - '.github/workflows/cd.yml'
      - '.github/scripts/ssh_run.sh'
      - '.github/scripts/deploy_targets.sh'
      - '.github/scripts/render_remote_release.sh'
      - 'client/**'
      - 'deploy/deploy_frontend.sh'
      - 'deploy/nginx.conf'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 部署后端（仅 main）
        type: boolean
        default: false
      deploy_frontend_main:
        description: 部署 main 前端（:80）
        type: boolean
        default: false

concurrency:
  group: zdmj-server-deploy
  cancel-in-progress: false

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: root
  APP_DIR_MAIN: /opt/zdmj/zdmj

jobs:
  deploy:
    name: Deploy on Server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy targets
        id: targets
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bash .github/scripts/deploy_targets.sh \
              --java "${{ inputs.deploy_backend }}" \
              --frontend "${{ inputs.deploy_frontend_main }}"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"
            else
              git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"
            fi
            bash .github/scripts/deploy_targets.sh --from-file "$RUNNER_TEMP/changed.txt"
          fi

      - name: Require CI success for backend deploy
        if: steps.targets.outputs.deploy_java == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            row=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci_java.yml --limit 1 --json status,conclusion)
            status=$(echo "$row" | jq -r '.[0].status // empty')
            conclusion=$(echo "$row" | jq -r '.[0].conclusion // empty')
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "同一提交的 CI 已通过"
              exit 0
            fi
            if [[ "$status" == "completed" && -n "$conclusion" ]]; then
              echo "同一提交的 CI 结果为 ${conclusion}"
              exit 1
            fi
            echo "等待 CI，第 ${attempt} 次，当前状态 ${status:-未创建}"
            sleep 20
          done
          echo "同一提交没有成功的 CI 结果"
          exit 1

      - name: Deploy on server
        if: |
          steps.targets.outputs.deploy_java == 'true' ||
          steps.targets.outputs.deploy_frontend == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          APP_DIR: ${{ env.APP_DIR_MAIN }}
          DEPLOY_JAVA: ${{ steps.targets.outputs.deploy_java }}
          DEPLOY_FRONTEND: ${{ steps.targets.outputs.deploy_frontend }}
          GIT_ORIGIN_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          bash .github/scripts/render_remote_release.sh \
            | bash .github/scripts/ssh_run.sh \
              "${{ env.SERVER_HOST }}" \
              "${{ env.SERVER_USER }}" \
              22 \
              4 \
              20 \
              2700
