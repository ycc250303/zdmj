# CI工作流：后端自动化测试
# 当代码推送到backend或main分支，或创建PR到这些分支时自动触发
name: CI - Backend Tests

# 触发条件配置
on:
  # 当代码推送到backend或main分支时触发
  push:
    branches:
      - backend
      # - main
    paths:
      - 'backend/zdmj/**'
      - '.github/workflows/ci_java.yml'
  # 当创建或更新PR到backend或main分支时触发
  pull_request:
    branches:
      - backend
      # - main
    paths:
      - 'backend/zdmj/**'
      - '.github/workflows/ci_java.yml'

jobs:
  # 测试任务
  test:
    name: Run Tests
    # 使用GitHub提供的Ubuntu最新版本作为运行环境
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1: 检出代码
      # 将仓库代码下载到GitHub Actions运行器中
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2: 设置Java开发环境
      # 安装JDK 21，使用Eclipse Temurin发行版（OpenJDK的免费版本）
      # 同时配置Maven缓存以加速后续构建
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # Java版本
          distribution: 'temurin'     # JDK发行版（Eclipse Temurin）
          cache: maven                # 启用Maven依赖缓存

      # 步骤3: 编译验证（暂时跳过测试执行）
      # 在backend/zdmj目录下执行Maven编译命令
      # clean: 清理之前的构建产物
      # compile: 只编译主代码，构建时间更短
      # 保留测试流水线结构，但暂时不执行测试用例
      # 如果需要恢复测试，将 compile 改为 test 即可
      - name: Compile and verify (skip tests)
        working-directory: ./backend/zdmj  # 指定工作目录
        run: mvn -B -ntp clean compile

      # 步骤4: 生成测试报告（暂时跳过）
      # 暂时注释掉测试报告生成步骤
      # 如果需要恢复测试，取消注释并修改步骤4为 test
      # - name: Generate test report
      #   if: always()  # 即使前面的步骤失败也执行
      #   working-directory: ./backend/zdmj  # 指定工作目录
      #   run: |
      #     mvn surefire-report:report || true  # 生成报告，即使失败也不影响整体流程

      # 步骤5: 上传测试结果（暂时跳过）
      # 暂时注释掉测试结果上传步骤
      # 如果需要恢复测试，取消注释并修改步骤4为 test
      # - name: Upload test results
      #   if: always()  # 无论测试结果如何都上传报告
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: test-results                    # 产物名称
      #     path: backend/zdmj/target/surefire-reports  # 测试报告文件路径
      #     retention-days: 7                     # 保留7天后自动删除
