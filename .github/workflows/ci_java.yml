name: CI - Backend Tests

on:
  push:
    branches:
      - backend
      - main
    paths:
      - 'backend/zdmj/**'
      - 'sql/**'
      - 'deploy/deploy_backend.sh'
      - 'deploy/sync_server_code.sh'
      - 'deploy/release.sh'
      - 'deploy/runtime.sh'
      - 'deploy/health.sh'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/ci_java.yml'
      - '.github/workflows/cd.yml'
      - '.github/scripts/ssh_run.sh'
      - '.github/scripts/deploy_targets.sh'
      - '.github/scripts/render_remote_release.sh'
  pull_request:
    branches:
      - backend
      - main
    paths:
      - 'backend/zdmj/**'
      - 'sql/**'
      - 'deploy/deploy_backend.sh'
      - 'deploy/sync_server_code.sh'
      - 'deploy/release.sh'
      - 'deploy/runtime.sh'
      - 'deploy/health.sh'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/ci_java.yml'
      - '.github/workflows/cd.yml'
      - '.github/scripts/ssh_run.sh'
      - '.github/scripts/deploy_targets.sh'
      - '.github/scripts/render_remote_release.sh'

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify backend
        id: verify
        working-directory: ./backend/zdmj
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          if-no-files-found: ignore
          path: |
            backend/zdmj/target/surefire-reports/**
            backend/zdmj/target/failsafe-reports/**
            backend/zdmj/target/site/jacoco/**
