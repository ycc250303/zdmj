# CI工作流：后端自动化测试
# 当代码推送到backend或main分支，或创建PR到这些分支时自动触发
name: CI - Backend Tests

# 触发条件配置
on:
  # 当代码推送到backend或main分支时触发
  push:
    branches:
      - backend
      # - main
    paths:
      - 'backend/zdmj/**'
      - '.github/workflows/ci_java.yml'
  # 当创建或更新PR到backend或main分支时触发
  pull_request:
    branches:
      - backend
      # - main
    paths:
      - 'backend/zdmj/**'
      - '.github/workflows/ci_java.yml'

jobs:
  # 测试任务
  test:
    name: Run Tests
    # 使用GitHub提供的Ubuntu最新版本作为运行环境
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1: 检出代码
      # 将仓库代码下载到GitHub Actions运行器中
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2: 设置Java开发环境
      # 安装JDK 21，使用Eclipse Temurin发行版（OpenJDK的免费版本）
      # 同时配置Maven缓存以加速后续构建
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # Java版本
          distribution: 'temurin'     # JDK发行版（Eclipse Temurin）
          cache: maven                # 启用Maven依赖缓存

      # 步骤3: 编译验证
      # clean: 清理之前的构建产物
      # compile: 编译主代码，不执行测试
      - name: Compile backend
        id: compile
        continue-on-error: true
        working-directory: ./backend/zdmj  # 指定工作目录
        run: mvn -B -ntp clean compile

      # 步骤4: 单元测试
      # 仅在编译通过后执行
      - name: Run unit tests
        id: unit_test
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: ./backend/zdmj
        run: mvn -B -ntp test

      # 步骤5: 失败提醒与统一退出
      # 在日志和 Summary 明确提示失败原因，并让 CI 最终失败
      - name: Notify when compile or tests fail
        if: always()
        run: |
          failed=0

          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "::error title=CI检查失败::后端编译未通过，请先修复编译错误后再提交。"
            echo "- ❌ 编译未通过（Compile backend）" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if [ "${{ steps.compile.outcome }}" = "success" ] && [ "${{ steps.unit_test.outcome }}" != "success" ]; then
            echo "::error title=CI检查失败::单元测试未通过，请修复失败用例后再提交。"
            echo "- ❌ 单元测试未通过（Run unit tests）" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "- ✅ 编译通过，单元测试通过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "请查看失败步骤日志并修复后重新触发 CI。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
