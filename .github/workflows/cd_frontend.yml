name: CD - Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'deploy/deploy_frontend.sh'
      - '.github/workflows/cd_frontend.yml'
  workflow_dispatch:

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_HOST: 111.229.81.45
  SERVER_USER: root
  APP_DIR: /opt/zdmj/zdmj
  DEPLOY_BRANCH: main

jobs:
  sync-server-code:
    name: Sync Code on Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pull latest code on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            git fetch --prune origin
            git checkout "${{ env.DEPLOY_BRANCH }}"
            git reset --hard "origin/${{ env.DEPLOY_BRANCH }}"
            git rev-parse --short HEAD
            ls -lah
            ls -lah deploy

  deploy-frontend:
    name: Deploy Frontend on Server
    runs-on: ubuntu-latest
    needs: sync-server-code
    timeout-minutes: 20

    steps:
      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "whoami=$(whoami)"
            echo "hostname=$(hostname)"
            cd "${{ env.APP_DIR }}"
            pwd
            ls -lah
            ls -lah deploy
            chmod +x /opt/zdmj/zdmj/deploy/deploy_frontend.sh
            /opt/zdmj/zdmj/deploy/deploy_frontend.sh