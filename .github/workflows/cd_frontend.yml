name: CD - Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'deploy/deploy_frontend.sh'
      - 'deploy/sync_server_code.sh'
      - '.github/workflows/cd_frontend.yml'
      - '.github/scripts/ssh_run.sh'
  workflow_dispatch:

concurrency:
  group: zdmj-server-deploy
  cancel-in-progress: false

env:
  SERVER_HOST: 111.229.81.45
  SERVER_USER: root
  APP_DIR: /opt/zdmj/zdmj
  DEPLOY_BRANCH: main

jobs:
  deploy-frontend:
    name: Deploy Frontend on Server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/ssh_run.sh \
            "${{ env.SERVER_HOST }}" \
            "${{ env.SERVER_USER }}" \
            22 \
            4 \
            20 \
            1200 \
            <<EOF
          set -euo pipefail
          echo "whoami=\$(whoami)"
          echo "hostname=\$(hostname)"
          cd "${{ env.APP_DIR }}"
          pwd
          ls -lah
          ls -lah deploy
          chmod +x /opt/zdmj/zdmj/deploy/deploy_frontend.sh
          /opt/zdmj/zdmj/deploy/deploy_frontend.sh
          echo "== Disk usage after frontend deploy =="
          df -h
          echo "== Cleanup pnpm store =="
          if [ -s "/root/.nvm/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "/root/.nvm/nvm.sh"
            nvm use 20 >/dev/null || true
          fi
          if command -v pnpm >/dev/null 2>&1; then
            pnpm store prune || true
          else
            echo "pnpm not found, skip pnpm store prune"
          fi
          EOF
