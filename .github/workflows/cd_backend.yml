# CD工作流：统一自动化部署
# GitHub Actions 负责编排与 SSH 下发；实际部署逻辑见 deploy/deploy_backend.sh
# 前置要求：
# 1. 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置 SSH_PRIVATE_KEY
# 2. SSH 私钥需包含完整 BEGIN/END 行，且对应公钥已写入服务器 ~/.ssh/authorized_keys

name: CD - Deploy Backend Services

on:
  push:
    branches:
      - main
    paths:
      - 'backend/zdmj/**'
      - 'deploy/deploy_backend.sh'
      - 'deploy/sync_server_code.sh'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/cd_backend.yml'
      - '.github/scripts/ssh_run.sh'
  workflow_dispatch:

concurrency:
  group: zdmj-server-deploy
  cancel-in-progress: false

env:
  SERVER_HOST: 111.229.81.45
  SERVER_USER: root
  APP_DIR: /opt/zdmj/zdmj
  DEPLOY_BRANCH: main
  DOCKER_CLEANUP_UNTIL: 168h

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - 'backend/zdmj/**'
              - 'deploy/deploy_backend.sh'
              - 'deploy/sync_server_code.sh'
              - 'deploy/docker-compose.yml'
              - '.github/workflows/cd_backend.yml'
              - '.github/scripts/ssh_run.sh'

  deploy-java:
    name: Deploy Java Service on Server
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 30
    if: needs.detect-changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/ssh_run.sh \
            "${{ env.SERVER_HOST }}" \
            "${{ env.SERVER_USER }}" \
            22 \
            4 \
            20 \
            1800 \
            <<EOF
          set -euo pipefail
          echo "whoami=\$(whoami)"
          echo "hostname=\$(hostname)"
          cd "${{ env.APP_DIR }}"
          pwd
          ls -lah deploy
          chmod +x "${{ env.APP_DIR }}/deploy/deploy_backend.sh"
          "${{ env.APP_DIR }}/deploy/deploy_backend.sh"
          echo "== Docker usage before cleanup =="
          docker system df || true
          echo "== Cleanup old Docker cache/images (${{ env.DOCKER_CLEANUP_UNTIL }}) =="
          docker builder prune -af --filter "until=${{ env.DOCKER_CLEANUP_UNTIL }}" || true
          docker image prune -af --filter "until=${{ env.DOCKER_CLEANUP_UNTIL }}" || true
          echo "== Docker usage after cleanup =="
          docker system df || true
          EOF
