# CD工作流：统一自动化部署
# GitHub Actions 负责编排与 SSH 下发；实际部署逻辑见 deploy/deploy_backend.sh
# 前置要求：
# 1. 在 GitHub 仓库 Settings > Secrets and variables > Actions 中配置 SSH_PRIVATE_KEY
# 2. SSH 私钥需包含完整 BEGIN/END 行，且对应公钥已写入服务器 ~/.ssh/authorized_keys

name: CD - Deploy Backend Services

on:
  push:
    branches:
      - main
    paths:
      - 'backend/zdmj/**'
      - 'deploy/deploy_backend.sh'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/cd_backend.yml'
  workflow_dispatch:

concurrency:
  group: cd-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_HOST: 111.229.81.45
  SERVER_USER: root
  APP_DIR: /opt/zdmj/zdmj
  DEPLOY_BRANCH: main

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java: ${{ steps.filter.outputs.java }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - 'backend/zdmj/**'
              - 'deploy/deploy_backend.sh'
              - 'deploy/docker-compose.yml'
              - '.github/workflows/cd_backend.yml'

  sync-server-code:
    name: Sync Code on Server
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 10
    if: needs.detect-changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Pull latest code on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            git fetch --prune origin
            git checkout "${{ env.DEPLOY_BRANCH }}"
            git reset --hard "origin/${{ env.DEPLOY_BRANCH }}"
            git rev-parse --short HEAD
            ls -lah deploy

  deploy-java:
    name: Deploy Java Service on Server
    runs-on: ubuntu-latest
    needs: [detect-changes, sync-server-code]
    timeout-minutes: 30
    if: needs.detect-changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "whoami=$(whoami)"
            echo "hostname=$(hostname)"
            cd "${{ env.APP_DIR }}"
            pwd
            ls -lah deploy
            chmod +x "${{ env.APP_DIR }}/deploy/deploy_backend.sh"
            "${{ env.APP_DIR }}/deploy/deploy_backend.sh"
